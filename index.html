<!doctype html>
<!-- Palette : changer data-palette ("lagon" | "indigo" | "ambre") -->
<html lang="fr" data-palette="lagon">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Amir Chouchane · Portfolio</title>
    <meta name="description" content="Portfolio d'Amir Chouchane, étudiant en BTS SIO au CFA ITIS, à la recherche d'une alternance en développement web et support informatique (rythme 2 j / 3 j, Paris et périphérie)." />
    <meta name="theme-color" content="#0A1014" />
    <meta name="author" content="Amir Chouchane" />
    <!-- Aperçu de partage (LinkedIn, Discord, WhatsApp…). L'adresse du site (VITE_SITE_URL, dans .env) est ajoutée par vite.config.ts. -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:site_name" content="Amir Chouchane · Portfolio" />
    <meta property="og:title" content="Amir Chouchane · Alternance BTS SIO, développement web et support IT" />
    <meta property="og:description" content="Portfolio d'Amir Chouchane : projets, compétences et parcours. Recherche une alternance en développement ou en support informatique, rythme 2 jours / 3 jours, Paris et périphérie." />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Amir Chouchane, alternance BTS SIO, développement web et support IT" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Gélule affichée instantanément (avant le chargement du code) : identique au 1er état du preloader React,
         qui la remplace sans saut. -->
    <style>
      #boot { position: fixed; inset: 0; z-index: 99; background: #0a1014; display: grid; place-items: center; }
      #boot span { width: 40vw; aspect-ratio: 710 / 255; border-radius: 999px; background: #111c21; }
      @media (max-width: 800px) { #boot span { width: 80vw; } }
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true"><span></span></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
