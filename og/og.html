<!doctype html>
<!-- Image d'aperçu (LinkedIn, Discord…). Générée avec : node og/build-og.mjs → public/og.png -->
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=JetBrains+Mono:wght@500&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
    <style>
      * { margin: 0; box-sizing: border-box; }
      body { width: 1200px; height: 630px; background: #0a1014; color: #e6f2f3; font-family: Inter, sans-serif; overflow: hidden; position: relative; }
      .glow1 { position: absolute; width: 900px; height: 900px; left: -260px; top: 120px; border-radius: 50%; background: radial-gradient(circle, rgba(45,212,191,.42), transparent 62%); }
      .glow2 { position: absolute; width: 760px; height: 760px; right: -220px; top: -300px; border-radius: 50%; background: radial-gradient(circle, rgba(56,189,248,.32), transparent 62%); }
      .dots { position: absolute; inset: 0; background-image: radial-gradient(rgba(230,242,243,.12) 1.4px, transparent 1.4px); background-size: 28px 28px; }
      .content { position: absolute; inset: 0; padding: 70px 80px; display: flex; flex-direction: column; }
      .eyebrow { font-family: "JetBrains Mono", monospace; font-size: 24px; color: #2dd4bf; }
      h1 { margin-top: 26px; font-family: "Space Grotesk", sans-serif; font-weight: 700; font-size: 118px; line-height: .95; letter-spacing: -.03em; }
      .role { margin-top: 26px; font-size: 34px; color: rgba(230,242,243,.82); }
      .bottom { margin-top: auto; display: flex; gap: 14px; }
      .pill { display: inline-flex; align-items: center; gap: 12px; padding: 12px 24px; border-radius: 999px; font-size: 24px; font-weight: 500; }
      .pill.on { background: #2dd4bf; color: #0a1014; }
      .pill.off { border: 2px solid rgba(230,242,243,.2); color: #e6f2f3; }
      .dot { width: 12px; height: 12px; border-radius: 50%; background: #0a1014; }
      .screen { position: absolute; right: 80px; top: 78px; width: 330px; height: 210px; border-radius: 18px; border: 10px solid #05090b; background: linear-gradient(135deg, #14524a, #0f2f42); box-shadow: 0 0 80px rgba(45,212,191,.35); }
      .screen::after { content: ""; position: absolute; left: 50%; bottom: -46px; width: 50px; height: 36px; transform: translateX(-50%); background: #c9d2d4; }
      .screen p { position: absolute; left: 20px; top: 22px; font-family: "JetBrains Mono", monospace; font-size: 15px; color: #2dd4bf; }
      .screen b { position: absolute; left: 20px; top: 54px; font-family: "Space Grotesk", sans-serif; font-size: 28px; color: #e6f2f3; }
    </style>
  </head>
  <body>
    <div class="glow1"></div>
    <div class="glow2"></div>
    <div class="dots"></div>
    <div class="screen"><p>&gt; Bonjour, je suis</p><b>Amir C.</b></div>
    <div class="content">
      <p class="eyebrow">// Portfolio · 2026</p>
      <h1>Amir<br />Chouchane</h1>
      <p class="role">Alternance BTS SIO · Développement web &amp; support IT</p>
      <div class="bottom">
        <span class="pill on"><span class="dot"></span>Disponible · rythme 2 j / 3 j</span>
        <span class="pill off">Paris et périphérie</span>
      </div>
    </div>
  </body>
</html>
